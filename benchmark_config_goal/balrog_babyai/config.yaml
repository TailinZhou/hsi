# Balrog BabyAI Benchmark Configuration
# Usage: python main.py benchmark_config_goal/balrog_babyai/config.yaml

llm:
  model: "deepseek-v4-flash"
  # model: "qwen36-fast"
  temperature: 0.0
  thinking_enabled: true            # true enables thinking mode, false disables
  reasoning_effort: "max"         # thinking effort: "high", "max"

evolution:
  lcb_zscore: 0.5  # LCB (lower confidence bound) z-score: larger is more conservative, penalizes unstable reward estimates; 0 = degrades to raw mean
  max_iterations: 5           # number of evolution iterations
  max_steps_per_iteration: 80    # max steps per iteration
  enable_bash: true
  max_context_tokens: 600000
  max_history_messages: 500
  max_tool_result_length: 100000
  evaluate_llm_summary: true
  evaluate_consolidate_summary: false
  init_eval_enabled: false  # run a dev evaluation of the init harness before evolution (produces experience text + true baseline reward); false=skip, iteration-1 cold start
  enable_file_log: true
  exclude_tools:
    - read_history_self
    - get_historic_version
    - view_evolution_graph
    - get_historic_eval_code
    # - bootstrap

harness:
  enable_bash: false
  temperature: 0.0  # LLM temperature during harness/evaluate phase (follows llm.temperature if unset)
  thinking_enabled: false  # thinking mode during harness/evaluate phase (follows llm.thinking_enabled if unset)
  # max_tokens: 1024  # max_tokens during harness phase (no limit if unset; recommend a small value to avoid wasting tokens per step)


init:
  godel_harness_init_path: "./godel_harness_init/balrog_babyai"
  godel_evolution_init_path: "./godel_evolution_init"

meta_evolve:
  # iter_per_metaevolve: 2  
  enabled: true
  max_steps: 50
  enable_bash: true
  # archive_strategy: "recursive"
  archive_strategy: "greedy"
  inject_seed_hypothesis: true
  seed_eval_enabled: true
  seed_eval_max_calls: 2
  # archive_strategy: "crossover"
  evolvable_commit_strategy: true
  commit_nudge_max_steps: 50
  seed_selection_max_steps: 50
  # Submit-best -- fixed, non-evolvable agentic final-best selection stage
  submit_best_enabled: true
  submit_best_max_steps: 80

output:
  directory: "./evolution_results/balrog_babyai"
  verbose: true

# ============================================================
# Benchmark common configuration
# ============================================================
benchmark:
  type: "balrog"
  suite: "babyai"

  max_tasks_per_category: null
  max_tasks_per_category_test: null

  verbose: false
  dev_ratio: 1.0            # 1.0 = all for dev, no test set split
  split_seed: 42
  val_ratio: 0.0
  mode: "batch"
  dynamic_sample: false            # true=resample dev on each evaluate (val/test fixed in advance), false=dev/val/test all fixed
  parallel_workers: 40             # number of parallel evaluation threads (1=sequential, default)
  run_all_tasks: true           # run full evaluation (dev+val+test) after evolution; default false only runs test set
  test_repeats: 3  # increase to run more times; set to 1 for debugging

# ============================================================
# Balrog-specific configuration
# ============================================================
balrog:
  seed: 42
  max_steps_per_episode_dev: null       # dev set (null = use environment default)
  max_steps_per_episode_non_dev: null   # val/test (null = use environment default)
  feedback_on_invalid_action: true
  # failed_threshold: -1 = adaptive (starts at first eval result, raises by margin)
  # any value >= 0 = static threshold
  failed_threshold: 1
  # adaptive_threshold_margin: 0.05  # fixed increment when agent beats threshold
  episode_workers: 5       # number of parallel episode evaluations per task
  num_episodes:
    babyai: 10                # default 10/20
  # Episode count for dev/val exploration phase (effective in dev and val modes): cheap discovery, noise handled by final evaluation.
  # Unlisted envs → dev/val also use num_episodes. test/final evaluation always uses the num_episodes above.
  num_episodes_dev:
    babyai: 3
  env_kwargs:
    babyai:
  #   #   num_dists: 0              # number of distractors (0=none)
      # max_episode_steps: 40      # limit BabyAI steps (default 0, i.e. no built-in cap, relies on terminated to end naturally)
    # nle:
      # max_episode_steps: 1000  # limit NLE max steps (default 100000)
    #   skip_more: true
    # minihack:
    #   max_episode_steps: 50    # limit MiniHack steps (default 100)
    # crafter:
    #   max_episode_steps: 50   # limit Crafter steps (default 2000)
    # textworld:
    #   max_episode_steps: 80    # limit TextWorld steps (default 80)
    #   # textworld_games_path: "./domains/balrog/tw_games"
    # babaisai:
    #   max_episode_steps: 50     # limit BabaIsAI steps (default 100)